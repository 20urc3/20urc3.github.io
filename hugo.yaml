baseURL: "https://2ourc3.com/"
title: 2ourc3
theme: hugo.386
languageCode: en
defaultContentLanguage: en

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  # --- Home page ---
  mainpagetitle: "2ourc3 - Salim LARGO"
  mainpagedesc: ""

  # Section headings on the home page
  articlesheading: "Articles"
  cveheading: "CVE"

  description: "Handcrafted bitflipping machines"
  keywords: [cybersecurity, fuzzing]
  author: "Salim LARGO"

  # Sections listed on the home page, in order
  mainSections:
    - posts
    - bugs

  # --- Loading animation (BOOTSTRA.386 CRT effect) ---
  loadfastload: true       # true = skip the boot animation
  loadspeedfactor: 1.0
  loadonepass: true

  showhugo: false

  # --- Social links in footer (leave unset to hide) ---
  github: "https://github.com/2ourc3"
  twitter: "https://x.com/2ourc3"

  copyright:
    name: "Salim LARGO"
    url: ""
    prefix: ""
    suffix: ""

  # Extra stylesheets/scripts layered on top of the theme
  customCSS:
    - css/syntax.css
    - css/extra.css
    - css/scheme-win98.css   # colour scheme; remove this line for DOS blue

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 1
    - identifier: bugs
      name: bugs
      url: /bugs/
      weight: 2

taxonomies:
  category: categories
  tag: tags

pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
