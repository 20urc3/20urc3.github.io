baseURL: "https://2ourc3.com/"
title: 2ourc3
theme: PaperMod
languageCode: en
defaultContentLanguage: en

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # enables opengraph, twitter-cards and schema
  title: 2ourc3
  description: "Handcrafted bitflipping machines"
  keywords: [cybersecurity, fuzzing]
  author: "Salim LARGO"
  DateFormat: "January 2, 2006"

  # --- black / dark only ---
  defaultTheme: dark
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: true
  hideSummary: false
  showtoc: false
  tocopen: false

  # Sections listed on the home page
  mainSections:
    - posts
    - bugs

  # --- Home page ---
  mainpagetitle: "Handcrafting weird machines"
  articlesheading: "Articles"
  cveheading: "CVE"

  assets:
    favicon: "/icon_rabbit.ico"

  label:
    text: "2ourc3"
    iconHeight: 25

  profileMode:
    enabled: false

  homeInfoParams:
    Title: "Handcrafted bitflipping machines."

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  # "Contact me" link in the footer
  contactURL: "https://x.com/2ourc3"

  socialIcons:
    - name: github
      url: "https://github.com/2ourc3"
    - name: x
      url: "https://x.com/2ourc3"

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 1
    - identifier: bugs
      name: bugs
      url: /bugs/
      weight: 2

taxonomies:
  category: categories
  tag: tags

pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
